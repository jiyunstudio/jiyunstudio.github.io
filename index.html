<style>
:root{--bg:#0b0d2a;--bg2:#141a4a;--fg:#eef0ff;--dim:#a9afd9;--gold:#f6c94c;--blue:#3d7bff;--line:rgba(169,175,217,.22);color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{min-height:100vh;min-height:100dvh}
body{background:radial-gradient(120% 80% at 50% 0%,var(--bg2) 0%,var(--bg) 60%) fixed,var(--bg);color:var(--fg);
font-family:"Pretendard","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
line-height:1.6;padding:0 20px;display:flex;flex-direction:column;align-items:center}
body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.7;
background-image:radial-gradient(1.2px 1.2px at 12% 18%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 78% 12%,#fff 50%,transparent 51%),
radial-gradient(1.4px 1.4px at 64% 38%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 22% 62%,#fff 50%,transparent 51%),
radial-gradient(1.2px 1.2px at 88% 70%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 40% 86%,#fff 50%,transparent 51%),
radial-gradient(1px 1px at 6% 90%,#fff 50%,transparent 51%),radial-gradient(1.3px 1.3px at 52% 8%,#fff 50%,transparent 51%)}
main{position:relative;width:100%;max-width:440px;padding:72px 0 40px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:18px}
.icon{width:128px;height:128px;border-radius:28px;box-shadow:0 10px 40px rgba(61,123,255,.35),0 0 0 1px var(--line)}
h1{margin:8px 0 0;font-size:2rem;letter-spacing:-.01em;line-height:1.2;text-wrap:balance}
h1 small{display:block;font-size:.95rem;font-weight:500;color:var(--dim);letter-spacing:.04em;margin-top:6px}
.tag{margin:0;color:var(--gold);font-weight:600;font-size:1.02rem}
.tag b{font-weight:600}
.tag span{display:block;color:var(--dim);font-weight:400;font-size:.92rem;margin-top:2px}
.btn{display:inline-flex;align-items:center;gap:10px;margin-top:8px;padding:14px 26px;border-radius:999px;background:var(--fg);color:#0b0d2a;
text-decoration:none;font-weight:700;font-size:1rem;box-shadow:0 6px 24px rgba(0,0,0,.35)}
.btns{display:inline-grid;gap:12px;margin-top:8px;max-width:100%}
.btns .btn{margin-top:0;min-width:248px;justify-content:center;white-space:nowrap}
.btn:active{transform:translateY(1px)}
.btn svg{width:20px;height:20px;flex:none}
@media (max-width:360px){.btns .btn{padding-inline:20px;font-size:.95rem}}
.lang{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));right:16px;z-index:2;display:flex;align-items:center;gap:2px;padding:3px;border-radius:999px;border:1px solid var(--line);background:rgba(11,13,42,.55);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.lang button{appearance:none;border:0;background:none;color:var(--dim);font:600 .82rem/1 inherit;font-family:inherit;padding:7px 11px;border-radius:999px;cursor:pointer}
.lang button[aria-pressed="true"]{background:rgba(238,240,255,.14);color:var(--fg)}
.lang span{width:1px;height:12px;background:var(--line)}
footer{position:relative;width:100%;max-width:440px;margin-top:auto;padding:28px 0 calc(28px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);
display:flex;flex-direction:column;align-items:center;gap:10px;font-size:.88rem;color:var(--dim)}
footer nav{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 18px}
footer a{color:var(--fg);text-decoration:none;border-bottom:1px solid var(--line)}
footer a:hover{border-color:var(--fg)}
</style>
</head>

<div class="lang" role="group" aria-label="Language">
  <button type="button" data-set="ko" aria-pressed="true">한국어</button><span aria-hidden="true"></span><button type="button" data-set="en" aria-pressed="false">EN</button>
</div>

<script>
/* 한국어 / English: ?lang=ko|en  →  saved choice  →  browser language (Korean → ko, otherwise en) */
(function(){
  var KEY='omsSiteLang', T={ko:'원모어스타 · Jiyun Studio',en:'One More Star · Jiyun Studio'};
  function pick(){
    try{var q=new URLSearchParams(location.search).get('lang');if(q==='ko'||q==='en')return q}catch(e){}
    try{var s=localStorage.getItem(KEY);if(s==='ko'||s==='en')return s}catch(e){}
    var l=(navigator.languages&&navigator.languages[0])||navigator.language||'ko';
    return /^ko/i.test(l)?'ko':'en';
  }
  function apply(lang){
    document.documentElement.lang=lang;document.title=T[lang];
    var n=document.querySelectorAll('[data-ko]');
    for(var i=0;i<n.length;i++){var v=n[i].getAttribute('data-'+lang);if(v!=null)n[i].textContent=v}
    var im=document.querySelector('img[data-alt-ko]');if(im)im.alt=im.getAttribute('data-alt-'+lang);
    var b=document.querySelectorAll('.lang button');
    for(var j=0;j<b.length;j++)b[j].setAttribute('aria-pressed',String(b[j].getAttribute('data-set')===lang));
  }
  var bs=document.querySelectorAll('.lang button');
  for(var k=0;k<bs.length;k++)bs[k].addEventListener('click',function(){
    var lang=this.getAttribute('data-set');apply(lang);try{localStorage.setItem(KEY,lang)}catch(e){}
  });
  apply(pick());
})();
</script>
